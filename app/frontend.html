<!DOCTYPE html>
<html>
<head>
  <title>Payment Test</title>
</head>
<body>

  <h2>Test Payment</h2>
  <button id="payBtn">Pay $20</button>

  <script>
    document.getElementById("payBtn").onclick = async () => {

      const res = await fetch("https://acwebsite.click/pay", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amount: 20
        })
      });

      const data = await res.json();

      console.log(data);

      if (data.clientSecret) {
        alert("PaymentIntent created successfully");
      } else {
        alert("Error creating PaymentIntent");
      }
    };
  </script>

</body>
</html>
