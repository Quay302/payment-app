<!DOCTYPE html>
<html>
<head>
  <title>Country Club POS</title>
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f6f8;
    }

    header {
      background: #0b3d2e;
      color: white;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
    }

    .layout {
      display: flex;
      height: calc(100vh - 60px);
    }

    /* LEFT CATEGORY BAR */
    .sidebar {
      width: 180px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 10px;
    }

    .tab {
      padding: 10px;
      margin-bottom: 8px;
      background: #f1f1f1;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
    }

    .tab.active {
      background: #0b3d2e;
      color: white;
    }

    /* CENTER PRODUCTS */
    .products {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tile {
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .tile:hover {
      transform: scale(1.02);
    }

    /* RIGHT CART */
    .cart {
      width: 320px;
      background: white;
      border-left: 1px solid #ddd;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    button.checkout {
      margin-top: 10px;
      padding: 14px;
      background: #0b3d2e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .search {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<header>Country Club POS (Shopify Style)</header>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="tab active" onclick="setCategory('tees')">Tee Times</div>
    <div class="tab" onclick="setCategory('balls')">Golf Balls</div>
    <div class="tab" onclick="setCategory('drinks')">Drinks</div>
    <div class="tab" onclick="setCategory('snacks')">Snacks</div>
  </div>

  <!-- PRODUCTS -->
  <div class="products" id="productGrid"></div>

  <!-- CART -->
  <div class="cart">

    <h3>Cart</h3>

    <div id="cartItems"></div>

    <div class="total">
      Total: $<span id="total">0</span>
    </div>

    <button class="checkout" onclick="checkout()">Checkout</button>

  </div>

</div>

<script>

let cart = [];
let category = "tees";

const data = {
  balls: [
    { name: "Titleist Pro V1", price: 55 },
    { name: "Callaway Chrome Soft", price: 50 },
    { name: "TaylorMade TP5", price: 52 }
  ],

  drinks: [
    { name: "Beer", price: 8 },
    { name: "Soda", price: 3 },
    { name: "Seltzer", price: 6 }
  ],

  snacks: [
    { name: "Protein Bar", price: 5 },
    { name: "Chex Mix", price: 4 },
    { name: "Fruit Cup", price: 3 }
  ],

  tees: [
    { name: "9 Holes Walking", price: 40 },
    { name: "9 Holes Cart", price: 55 },
    { name: "18 Holes Walking", price: 70 },
    { name: "18 Holes Cart", price: 85 }
  ]
};

// -------- CATEGORY SWITCH --------
function setCategory(cat) {
  category = cat;

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");

  renderProducts();
}

// -------- PRODUCTS --------
function renderProducts() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  data[category].forEach(item => {
    grid.innerHTML += `
      <div class="tile" onclick="addItem('${item.name}', ${item.price})">
        <b>${item.name}</b><br>
        $${item.price}
      </div>
    `;
  });
}

// -------- CART --------
function addItem(name, price) {
  cart.push({ name, price });
  renderCart();
}

function renderCart() {
  const div = document.getElementById("cartItems");
  div.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    total += i.price;

    div.innerHTML += `
      <div class="cart-item">
        <span>${i.name}</span>
        <span>$${i.price}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total;
}

// -------- CHECKOUT --------
async function checkout() {

  if (cart.length === 0) {
    alert("Cart is empty");
    return;
  }

  const res = await fetch("https://acwebsite.click/pay", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: cart })
  });

  const data = await res.json();

  if (data.url) {
    window.location.href = data.url;
  } else {
    alert("Payment failed");
  }
}

// init
renderProducts();

</script>

</body>
</html>
