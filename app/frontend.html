<!DOCTYPE html>
<html>
<head>
  <title>Country Club POS</title>
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #f5f5f5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 600px;
    }

    .item {
      padding: 15px;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid #ddd;
    }

    .item:hover {
      background: #eee;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      font-size: 16px;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>⛳ Country Club POS System</h2>

  <div class="grid">

    <div class="item" onclick="selectItem('Golf Balls', 5)">
      🏌️ Golf Balls - $25
    </div>

    <div class="item" onclick="selectItem('Beer', 8)">
      🍺 Beer - $8
    </div>

    <div class="item" onclick="selectItem('Soda', 3)">
      🥤 Soda - $3
    </div>

    <div class="item" onclick="selectItem('Snack Bar', 6)">
      🍫 Snacks - $6
    </div>

    <div class="item" onclick="selectItem('Tee Time Guest Fee', 40)">
      ⛳ Tee Time Guest - $40
    </div>

  </div>

  <h3 id="selected">Selected: None</h3>

  <button id="payBtn">Pay Now</button>

  <div id="status"></div>

  <script>
    const stripe = Stripe("pk_test_51TUAfiACaedQXQHkvu0PYn6gR4E2PrmwMnqGGqNs3hF9dfAlC4JK63qJdSIfRxz1JW0nt7V2O5pxvFO0OVtHgdSh00sg8YtKnb");

    let selectedItem = null;
    let selectedPrice = 0;

    function selectItem(name, price) {
      selectedItem = name;
      selectedPrice = price;
      document.getElementById("selected").innerText =
        `Selected: ${name} - $${price}`;
    }

    document.getElementById("payBtn").onclick = async () => {

      if (!selectedItem) {
        alert("Select an item first");
        return;
      }

      const status = document.getElementById("status");
      status.innerText = "Processing...";

      const res = await fetch("https://acwebsite.click/pay", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          amount: selectedPrice,
          item: selectedItem
        })
      });

      const data = await res.json();

      const result = await stripe.confirmCardPayment(data.clientSecret, {
        payment_method: {
          card: {
            number: "4242 4242 4242 4242",
            exp_month: 12,
            exp_year: 2030,
            cvc: "123"
          }
        }
      });

      if (result.paymentIntent?.status === "succeeded") {
        status.innerText = "✔ Payment Successful";
      } else {
        status.innerText = "❌ Payment Failed";
      }

      console.log(result);
    };
  </script>

</body>
</html>
