<!DOCTYPE html>
<html>
<head>
  <title>Payment Test</title>

  <!-- Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      font-family: Arial;
      padding: 40px;
    }

    #card-element {
      padding: 12px;
      border: 1px solid #ccc;
      max-width: 400px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Test Payment ($20)</h2>

  <!-- Stripe Card Input goes here -->
  <div id="card-element"></div>

  <!-- Pay button -->
  <button id="payBtn">Pay $20</button>

  <p id="status"></p>


<script>
const stripe = Stripe("pk_test_51TUAfiACaedQXQHkvu0PYn6gR4E2PrmwMnqGGqNs3hF9dfAlC4JK63qJdSIfRxz1JW0nt7V2O5pxvFO0OVtHgdSh00sg8YtKnb");

const elements = stripe.elements();
const card = elements.create("card");
card.mount("#card-element");

document.getElementById("payBtn").onclick = async () => {

  console.log("PAY CLICKED");

  const res = await fetch("https://acwebsite.click/pay", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount: 20 })
  });

  const data = await res.json();
  console.log("PaymentIntent response:", data);

  if (!data.clientSecret) {
    alert("FAILED: no clientSecret");
    return;
  }

  // 🔥 THIS IS THE STEP YOU WERE MISSING
  const result = await stripe.confirmCardPayment(data.clientSecret, {
    payment_method: {
      card: card
    }
  });

  console.log("Stripe result:", result);

  if (result.error) {
    alert("Payment failed: " + result.error.message);
  } else {
    alert("Payment status: " + result.paymentIntent.status);
  }
};
  </script>

</body>
</html>
