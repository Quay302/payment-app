<!DOCTYPE html>
<html>
<head>
  <title>Country Club POS</title>
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #f4f4f4;
    }

    .layout {
      display: flex;
      gap: 30px;
    }

    .menu, .cart {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 50%;
    }

    .item {
      padding: 10px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 8px;
    }

    .item:hover {
      background: #eee;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2> Country Club POS System</h2>

<div class="layout">

  <!-- MENU -->
  <div class="menu">
    <h3>Menu</h3>

    <div class="item" onclick="addItem('Golf Balls', 25)"> Golf Balls - $25</div>
    <div class="item" onclick="addItem('Beer', 8)"> Beer - $8</div>
    <div class="item" onclick="addItem('Soda', 3)"> Soda - $3</div>
    <div class="item" onclick="addItem('Snacks', 6)"> Snacks - $6</div>
    <div class="item" onclick="addItem('Tee Time Guest', 40)"> Tee Time Guest - $40</div>

  </div>

  <!-- CART -->
  <div class="cart">
    <h3>Cart</h3>

    <div id="cart"></div>

    <h3>Total: $<span id="total">0</span></h3>

    <button onclick="checkout()">Checkout</button>

    <div id="status"></div>
  </div>

</div>

<script>
  const stripe = Stripe("pk_test_51TUAfiACaedQXQHkvu0PYn6gR4E2PrmwMnqGGqNs3hF9dfAlC4JK63qJdSIfRxz1JW0nt7V2O5pxvFO0OVtHgdSh00sg8YtKnb");

  let cart = [];

  function addItem(name, price) {
    cart.push({ name, price });
    renderCart();
  }

  function renderCart() {
    const cartDiv = document.getElementById("cart");
    cartDiv.innerHTML = "";

    let total = 0;

    cart.forEach(item => {
      total += item.price;

      cartDiv.innerHTML += `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>$${item.price}</span>
        </div>
      `;
    });

    document.getElementById("total").innerText = total;
  }

  async function checkout() {

    if (cart.length === 0) {
      alert("Cart is empty");
      return;
    }

    document.getElementById("status").innerText = "Redirecting to checkout...";

    const res = await fetch("https://acwebsite.click/pay", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        items: cart
      })
    });

    const data = await res.json();

    if (data.error) {
      document.getElementById("status").innerText = data.error;
      return;
    }

    // 🚀 THIS IS THE SHOPIFY-LIKE EXPERIENCE
    window.location.href = data.url;
  }
</script>

</body>
</html>
